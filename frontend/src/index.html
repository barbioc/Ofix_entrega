<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <title>Ofix · Profesionales para tu hogar</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Conectá con electricistas, gasistas y plomeros verificados. Asignación automática de urgencia o elegí el profesional que prefieras.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Aplica el tema guardado antes de pintar, para evitar un destello claro en modo oscuro.
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('ofix-tema') || 'system'; } catch (e) {}
      var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
